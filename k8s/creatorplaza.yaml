apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: creatorplaza
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - store.example.com
      secretName: store-tls
  rules:
    - host: store.example.com
      http:
        paths:
          - path: /api/webhooks
            pathType: Prefix
            backend:
              service:
                name: spree-storefront
                port:
                  number: 3001
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: spree-dashboard
                port:
                  number: 8080
          - path: /sellers
            pathType: Prefix
            backend:
              service:
                name: spree-seller-dashboard
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: spree-api
                port:
                  number: 3000
          - path: /rails
            pathType: Prefix
            backend:
              service:
                name: spree-api
                port:
                  number: 3000
          - path: /up
            pathType: Prefix
            backend:
              service:
                name: spree-api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spree-storefront
                port:
                  number: 3001
