name: Build and publish container images

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: server/Dockerfile
          - image: storefront
            context: apps/storefront
            file: Dockerfile
          - image: dashboard
            context: .
            file: apps/dashboard/Dockerfile
          - image: seller-dashboard
            context: .
            file: apps/seller-dashboard/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Validate registry and storefront variables
        env:
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          CONTAINER_NAMESPACE: ${{ vars.CONTAINER_NAMESPACE }}
          SPREE_API_URL: ${{ vars.SPREE_API_URL }}
          SPREE_PUBLISHABLE_KEY: ${{ vars.SPREE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          test -n "$CONTAINER_REGISTRY" || { echo "::error::Configure CONTAINER_REGISTRY."; exit 1; }
          test -n "$CONTAINER_NAMESPACE" || { echo "::error::Configure CONTAINER_NAMESPACE."; exit 1; }
          test -n "$SPREE_API_URL" || { echo "::error::Configure SPREE_API_URL."; exit 1; }
          test -n "$SPREE_PUBLISHABLE_KEY" || { echo "::error::Configure SPREE_PUBLISHABLE_KEY."; exit 1; }
          test -n "$NEXT_PUBLIC_SITE_URL" || { echo "::error::Configure NEXT_PUBLIC_SITE_URL."; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY }}
          username: ${{ secrets.CONTAINER_USERNAME }}
          password: ${{ secrets.CONTAINER_PASSWORD }}

      - name: Normalize image name
        id: image
        env:
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          CONTAINER_NAMESPACE: ${{ vars.CONTAINER_NAMESPACE }}
        run: |
          registry="$(printf '%s' "$CONTAINER_REGISTRY" | tr '[:upper:]' '[:lower:]')"
          namespace="$(printf '%s' "$CONTAINER_NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          echo "name=$registry/$namespace/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SPREE_API_URL=${{ vars.SPREE_API_URL }}
            SPREE_PUBLISHABLE_KEY=${{ vars.SPREE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
