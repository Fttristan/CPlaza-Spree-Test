server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location = /sellers {
        return 308 /sellers/;
    }

    location /sellers/ {
        try_files $uri $uri/ /sellers/index.html;
    }
}
